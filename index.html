<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0d1b4b">
<meta name="mobile-web-app-capable" content="yes">
<title>TIM Business CRM</title>
<link rel="manifest" href="manifest.json">
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script src="crm-logic.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'DM Sans','Segoe UI',sans-serif;background:#f4f6f9;min-height:100vh;color:#1a1f2e}
input,select,textarea,button{font-family:inherit}
button{cursor:pointer}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:4px}
</style>

<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useCallback}=React;
const {CATALOG,computeServiceCounters,expandCartToRecords}=CrmLogic;

const STORAGE_KEY='tim_crm_v2';
const SESSION_KEY='tim_session';

/* ── AUTH HELPERS ─────────────────────────────── */
function getSession(){try{return JSON.parse(localStorage.getItem(SESSION_KEY))||null}catch{return null}}
function setSession(s){localStorage.setItem(SESSION_KEY,JSON.stringify(s))}
function clearSession(){localStorage.removeItem(SESSION_KEY)}

async function apiLogin(username,password){
  const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password})});
  return r.json();
}

/* ── CRM DATA ─────────────────────────────────── */
const RISK={basso:{color:"#22c55e",bg:"#f0fdf4",label:"Basso"},medio:{color:"#f59e0b",bg:"#fffbeb",label:"Medio"},alto:{color:"#ef4444",bg:"#fef2f2",label:"Alto"}};
const EMPTY={name:"",contact:"",phone:"",contractStart:"",contractEnd:"",notes:"",churnRisk:"basso"};
const EMPTY_REFERENTE={name:"",role:"",phone:"",email:"",notes:""};
const SERVICE_STATUS_LABEL={attivo:"Attivo","in attivazione":"In attivazione",cessato:"Cessato"};
const CATEGORY_LABEL={fissa:"Rete fissa",mobile:"Mobile",aggiuntivo:"Profilo aggiuntivo",energia:"Energia"};
const FLAG_LABEL={voceInternet:"Voce+Internet",soloInternet:"Solo Internet",backup:"Backup",casa:"Casa",voceDati:"Voce+Dati",soloDati:"Solo Dati",numeroVariabile:"Numero Variabile",axpo:"Axpo"};

function daysUntil(d){return Math.ceil((new Date(d)-new Date())/86400000)}
function yearsActive(d){if(!d)return null;return(new Date()-new Date(d))/(86400000*365)}
function fmt(d){if(!d)return"—";return new Date(d).toLocaleDateString("it-IT",{day:"2-digit",month:"short",year:"numeric"})}
function fmtTime(d){if(!d)return"—";return new Date(d).toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"})}
function todayStr(){return new Date().toISOString().split("T")[0]}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}

/* ── ANAGRAFICA CALL CENTER (contatti/prospect, separati dai Clienti) ── */
const CC_STATUS_LABEL={interessato:'Interessato',non_interessato:'Non interessato',richiamata:'Richiamata',appuntamento:'Appuntamento',segreteria:'Segreteria',da_chiamare:'Da chiamare'};
const CC_STATUS_COLOR={interessato:'#22c55e',non_interessato:'#ef4444',richiamata:'#f59e0b',appuntamento:'#8b5cf6',segreteria:'#3b82f6',da_chiamare:'#64748b'};
const CC_STATUS_BG={interessato:'#f0fdf4',non_interessato:'#fef2f2',richiamata:'#fffbeb',appuntamento:'#f5f3ff',segreteria:'#eff6ff',da_chiamare:'#f1f5f9'};

/* ── STYLES ───────────────────────────────────── */
const S={
  app:{fontFamily:"'DM Sans','Segoe UI',sans-serif",background:"#f4f6f9",minHeight:"100vh"},
  hdr:{background:"#0d1b4b",color:"#fff",padding:"12px 16px",display:"flex",alignItems:"center",justifyContent:"space-between",position:"sticky",top:0,zIndex:100,boxShadow:"0 2px 8px rgba(0,0,0,.2)"},
  wrap:{padding:"16px",maxWidth:960,margin:"0 auto"},
  card:{background:"#fff",borderRadius:12,padding:16,boxShadow:"0 1px 4px rgba(0,0,0,.07)",marginBottom:12},
  inp:{padding:"9px 12px",borderRadius:8,border:"1.5px solid #e2e8f0",fontSize:13,outline:"none",width:"100%",background:"#fff"},
  sel:{padding:"8px 10px",borderRadius:8,border:"1.5px solid #e2e8f0",fontSize:12,background:"#fff",cursor:"pointer",color:"#1a1f2e",width:"100%"},
  lbl:{fontSize:11,fontWeight:600,color:"#475569",marginBottom:4,display:"block"},
  nb:(a)=>({padding:"7px 10px",borderRadius:8,border:"none",cursor:"pointer",fontSize:12,fontWeight:700,background:a?"#3b82f6":"rgba(255,255,255,.12)",color:"#fff"}),
  btn:(v)=>({padding:v==="sm"?"5px 10px":v==="lg"?"12px 20px":"9px 16px",borderRadius:8,border:"none",cursor:"pointer",fontSize:v==="sm"?12:13,fontWeight:700}),
  pri:{background:"#3b82f6",color:"#fff"},
  suc:{background:"#22c55e",color:"#fff"},
  dan:{background:"#fee2e2",color:"#ef4444"},
  gho:{background:"transparent",color:"#64748b"},
  tbl:{width:"100%",borderCollapse:"collapse"},
  th:{textAlign:"left",fontSize:10,fontWeight:700,color:"#64748b",textTransform:"uppercase",letterSpacing:".05em",padding:"6px 8px",borderBottom:"2px solid #f1f5f9"},
  td:{padding:"10px 8px",borderBottom:"1px solid #f8fafc",verticalAlign:"middle",fontSize:13},
  yn:(v)=>({fontSize:11,fontWeight:700,padding:"2px 8px",borderRadius:20,background:v?"#f0fdf4":"#f8fafc",color:v?"#22c55e":"#94a3b8"}),
  badge:(r)=>({fontSize:11,fontWeight:700,padding:"2px 8px",borderRadius:20,background:RISK[r]?.bg||"#f1f5f9",color:RISK[r]?.color||"#64748b"}),
  toast:(t)=>({position:"fixed",bottom:20,left:"50%",transform:"translateX(-50%)",background:t==="err"?"#ef4444":"#22c55e",color:"#fff",padding:"10px 20px",borderRadius:10,fontWeight:700,fontSize:13,zIndex:999,boxShadow:"0 4px 12px rgba(0,0,0,.2)",whiteSpace:"nowrap"}),
};

/* ── LOGIN SCREEN ─────────────────────────────── */
function LoginScreen({onLogin}){
  const [username,setUsername]=useState('');
  const [password,setPassword]=useState('');
  const [showPass,setShowPass]=useState(false);
  const [err,setErr]=useState('');
  const [busy,setBusy]=useState(false);

  const go=async(e)=>{
    e&&e.preventDefault();
    if(!username||!password)return setErr('Inserisci username e password');
    setBusy(true);setErr('');
    try{
      const res=await apiLogin(username,password);
      if(res.ok){
        setSession({role:res.role,name:res.name});
        onLogin(res.role,res.name);
      } else {
        setErr('Credenziali non valide');
      }
    }catch{
      setErr('Errore di connessione');
    }
    setBusy(false);
  };

  return(
    <div style={{minHeight:'100vh',background:'linear-gradient(135deg,#0d1b4b 0%,#1e3a8a 100%)',display:'flex',alignItems:'center',justifyContent:'center',padding:20}}>
      <div style={{background:'#fff',borderRadius:20,padding:'40px 32px',width:'100%',maxWidth:380,boxShadow:'0 24px 80px rgba(0,0,0,.35)'}}>
        <div style={{textAlign:'center',marginBottom:32}}>
          <div style={{width:64,height:64,background:'linear-gradient(135deg,#0d1b4b,#3b82f6)',borderRadius:18,display:'flex',alignItems:'center',justifyContent:'center',fontSize:30,margin:'0 auto 16px',boxShadow:'0 8px 24px rgba(59,130,246,.3)'}}>📱</div>
          <h1 style={{fontSize:22,fontWeight:800,color:'#0d1b4b',marginBottom:4}}>TIM Business</h1>
          <p style={{fontSize:13,color:'#64748b'}}>Accedi al tuo account</p>
        </div>

        <form onSubmit={go}>
          <div style={{marginBottom:14}}>
            <label style={S.lbl}>Username</label>
            <input
              style={{...S.inp,fontSize:14}}
              type="text"
              value={username}
              onChange={e=>setUsername(e.target.value)}
              placeholder="es. christopher"
              autoComplete="username"
              autoFocus
            />
          </div>
          <div style={{marginBottom:6}}>
            <label style={S.lbl}>Password</label>
            <div style={{position:'relative'}}>
              <input
                style={{...S.inp,fontSize:14,paddingRight:44}}
                type={showPass?'text':'password'}
                value={password}
                onChange={e=>setPassword(e.target.value)}
                placeholder="••••••••"
                autoComplete="current-password"
              />
              <button type="button" onClick={()=>setShowPass(s=>!s)} style={{position:'absolute',right:12,top:'50%',transform:'translateY(-50%)',background:'none',border:'none',cursor:'pointer',fontSize:16,color:'#94a3b8'}}>
                {showPass?'🙈':'👁'}
              </button>
            </div>
          </div>
          {err&&<p style={{color:'#ef4444',fontSize:12,marginBottom:10,marginTop:6}}>{err}</p>}
          <button
            type="submit"
            disabled={busy}
            style={{width:'100%',padding:'14px 0',borderRadius:10,border:'none',background:busy?'#94a3b8':'linear-gradient(135deg,#0d1b4b,#3b82f6)',color:'#fff',fontWeight:700,fontSize:15,cursor:busy?'default':'pointer',marginTop:14,letterSpacing:.3,fontFamily:'inherit'}}
          >
            {busy?'Accesso in corso...':'Accedi →'}
          </button>
        </form>

        <div style={{marginTop:24,padding:'12px 16px',background:'#f8fafc',borderRadius:10,fontSize:11,color:'#94a3b8',textAlign:'center'}}>
          🔒 Accesso riservato · TIM Business CRM
        </div>
      </div>
    </div>
  );
}


/* ── APPOINTMENT MODAL ──────────────────────────────────────── */
function AppointmentModal({onClose,onSaved}){
  const [company,setCompany]=useState('');
  const [contact,setContact]=useState('');
  const [phone,setPhone]=useState('');
  const [date,setDate]=useState('');
  const [time,setTime]=useState('');
  const [notes,setNotes]=useState('');
  const [busy,setBusy]=useState(false);
  const [err,setErr]=useState('');

  const save=async()=>{
    if(!company.trim())return setErr('Inserisci il nome azienda');
    if(!date)return setErr('Seleziona una data');
    setBusy(true);setErr('');
    try{
      const r=await fetch('/api/appointment',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({company,contactName:contact,phone,date,time,notes})});
      let d={};
      try{d=await r.json();}catch{}
      if(!r.ok)return setErr('Errore '+(d.error||r.status||'sconosciuto'));
      onSaved();
      onClose();
    }catch(e){setErr('Errore: '+e.message);}
    setBusy(false);
  };

  return(
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.55)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:1000,padding:20}}>
      <div style={{background:'#fff',borderRadius:16,padding:'28px 24px',width:'100%',maxWidth:480,boxShadow:'0 20px 60px rgba(0,0,0,.3)'}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:20}}>
          <h2 style={{fontSize:17,fontWeight:800,color:'#0d1b4b'}}>🗓 Nuovo Appuntamento</h2>
          <button onClick={onClose} style={{background:'none',border:'none',fontSize:20,cursor:'pointer',color:'#94a3b8'}}>✕</button>
        </div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12,marginBottom:12}}>
          <div style={{gridColumn:'1/-1'}}>
            <label style={S.lbl}>Azienda *</label>
            <input style={S.inp} value={company} onChange={e=>setCompany(e.target.value)} placeholder="Es. Rossi SRL" autoFocus/>
          </div>
          <div>
            <label style={S.lbl}>Referente</label>
            <input style={S.inp} value={contact} onChange={e=>setContact(e.target.value)} placeholder="Nome cognome"/>
          </div>
          <div>
            <label style={S.lbl}>Telefono</label>
            <input style={S.inp} value={phone} onChange={e=>setPhone(e.target.value)} placeholder="333 1234567"/>
          </div>
          <div>
            <label style={S.lbl}>Data *</label>
            <input style={S.inp} type="date" value={date} onChange={e=>setDate(e.target.value)} min={todayStr()}/>
          </div>
          <div>
            <label style={S.lbl}>Orario</label>
            <input style={S.inp} type="time" value={time} onChange={e=>setTime(e.target.value)}/>
          </div>
          <div style={{gridColumn:'1/-1'}}>
            <label style={S.lbl}>Note</label>
            <textarea style={{...S.inp,height:70,resize:'vertical'}} value={notes} onChange={e=>setNotes(e.target.value)} placeholder="Motivo, prodotti di interesse..."/>
          </div>
        </div>
        {err&&<p style={{color:'#ef4444',fontSize:12,marginBottom:10}}>{err}</p>}
        <div style={{display:'flex',gap:10}}>
          <button onClick={save} disabled={busy} style={{...S.btn('lg'),...S.suc,flex:1,opacity:busy?.7:1}}>
            {busy?'Salvataggio...':'💾 Salva Appuntamento'}
          </button>
          <button onClick={onClose} style={{...S.btn('lg'),...S.gho}}>Annulla</button>
        </div>
        <p style={{fontSize:11,color:'#94a3b8',marginTop:10,textAlign:'center'}}>✓ Verrà aggiunto al Google Calendar automaticamente</p>
      </div>
    </div>
  );
}

/* ── PROSPECT MODAL (anagrafica Call Center: aggiungi/modifica) ── */
function ProspectModal({initial,onClose,onSaved}){
  const [company,setCompany]=useState(initial?.company||'');
  const [contact,setContact]=useState(initial?.contact||'');
  const [phone,setPhone]=useState(initial?.phone||'');
  const [email,setEmail]=useState(initial?.email||'');
  const [city,setCity]=useState(initial?.city||'');
  const [province,setProvince]=useState(initial?.province||'');
  const [sector,setSector]=useState(initial?.sector||'');
  const [status,setStatus]=useState(initial?.status||'da_chiamare');
  const [callbackDate,setCallbackDate]=useState(initial?.callbackDate||'');
  const [notes,setNotes]=useState(initial?.notes||'');
  const [err,setErr]=useState('');

  const save=()=>{
    if(!company.trim())return setErr('Inserisci il nome azienda');
    if(!phone.trim())return setErr('Inserisci il numero di telefono');
    onSaved({
      id:initial?.id,
      company:company.trim(),contact:contact.trim(),phone:phone.trim(),email:email.trim(),
      city:city.trim(),province:province.trim(),sector:sector.trim(),
      status,callbackDate:callbackDate||null,notes:notes.trim(),
    });
  };

  return(
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.55)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:1000,padding:20}}>
      <div style={{background:'#fff',borderRadius:16,padding:'28px 24px',width:'100%',maxWidth:520,boxShadow:'0 20px 60px rgba(0,0,0,.3)'}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:20}}>
          <h2 style={{fontSize:17,fontWeight:800,color:'#0d1b4b'}}>{initial?'✏️ Modifica contatto':'➕ Nuovo contatto'}</h2>
          <button onClick={onClose} style={{background:'none',border:'none',fontSize:20,cursor:'pointer',color:'#94a3b8'}}>✕</button>
        </div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12,marginBottom:12}}>
          <div style={{gridColumn:'1/-1'}}><label style={S.lbl}>Azienda *</label><input style={S.inp} value={company} onChange={e=>setCompany(e.target.value)} placeholder="Es. Rossi SRL" autoFocus/></div>
          <div><label style={S.lbl}>Referente</label><input style={S.inp} value={contact} onChange={e=>setContact(e.target.value)} placeholder="Nome cognome"/></div>
          <div><label style={S.lbl}>Telefono *</label><input style={S.inp} value={phone} onChange={e=>setPhone(e.target.value)} placeholder="333 1234567"/></div>
          <div><label style={S.lbl}>Email</label><input style={S.inp} value={email} onChange={e=>setEmail(e.target.value)}/></div>
          <div><label style={S.lbl}>Città</label><input style={S.inp} value={city} onChange={e=>setCity(e.target.value)}/></div>
          <div><label style={S.lbl}>Provincia</label><input style={S.inp} value={province} onChange={e=>setProvince(e.target.value)}/></div>
          <div><label style={S.lbl}>Settore</label><input style={S.inp} value={sector} onChange={e=>setSector(e.target.value)}/></div>
          <div><label style={S.lbl}>Stato</label>
            <select style={{...S.inp,cursor:'pointer'}} value={status} onChange={e=>setStatus(e.target.value)}>
              {Object.keys(CC_STATUS_LABEL).map(k=><option key={k} value={k}>{CC_STATUS_LABEL[k]}</option>)}
            </select>
          </div>
          <div><label style={S.lbl}>Data ricontatto</label><input style={S.inp} type="date" value={callbackDate||''} onChange={e=>setCallbackDate(e.target.value)}/></div>
          <div style={{gridColumn:'1/-1'}}><label style={S.lbl}>Note</label><textarea style={{...S.inp,height:70,resize:'vertical'}} value={notes} onChange={e=>setNotes(e.target.value)}/></div>
        </div>
        {err&&<p style={{color:'#ef4444',fontSize:12,marginBottom:10}}>{err}</p>}
        <div style={{display:'flex',gap:10}}>
          <button onClick={save} style={{...S.btn('lg'),...S.suc,flex:1}}>💾 Salva</button>
          <button onClick={onClose} style={{...S.btn('lg'),...S.gho}}>Annulla</button>
        </div>
      </div>
    </div>
  );
}

/* ── SERVICE FLAGS (checkbox pertinenti in base alla categoria) ── */
function ServiceFlags({category,values,onChange}){
  const flagsByCategory={fissa:['voceInternet','soloInternet','backup','casa'],mobile:['voceDati','soloDati','numeroVariabile'],energia:['axpo'],aggiuntivo:[]};
  const flags=flagsByCategory[category]||[];
  if(flags.length===0)return null;
  return(
    <div style={{display:'flex',flexWrap:'wrap',gap:10,marginTop:6}}>
      {flags.map(f=>(
        <label key={f} style={{display:'flex',alignItems:'center',gap:6,fontSize:12,color:'#475569',cursor:'pointer'}}>
          <input type="checkbox" checked={!!values[f]} onChange={e=>onChange(f,e.target.checked)}/>
          {FLAG_LABEL[f]}
        </label>
      ))}
    </div>
  );
}

/* ── SERVICE MODAL (modifica un singolo record di servizio) ── */
function ServiceModal({service,onClose,onSaved}){
  const [phone,setPhone]=useState(service.phone||'');
  const [saleDate,setSaleDate]=useState(service.saleDate||'');
  const [activationDate,setActivationDate]=useState(service.activationDate||'');
  const [status,setStatus]=useState(service.status||'attivo');
  const [notes,setNotes]=useState(service.notes||'');
  const [flags,setFlags]=useState({
    voceInternet:service.voceInternet,soloInternet:service.soloInternet,backup:service.backup,casa:service.casa,
    voceDati:service.voceDati,soloDati:service.soloDati,numeroVariabile:service.numeroVariabile,axpo:service.axpo,
  });
  const [pod,setPod]=useState(service.pod||'');
  const [pdr,setPdr]=useState(service.pdr||'');

  const save=()=>{
    onSaved({...service,phone:phone||null,saleDate,activationDate:activationDate||null,status,notes,...flags,pod:pod||null,pdr:pdr||null});
  };

  return(
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.55)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:1000,padding:20}}>
      <div style={{background:'#fff',borderRadius:16,padding:'28px 24px',width:'100%',maxWidth:460,boxShadow:'0 20px 60px rgba(0,0,0,.3)'}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:20}}>
          <h2 style={{fontSize:17,fontWeight:800,color:'#0d1b4b'}}>✏️ {CATEGORY_LABEL[service.category]} — {service.profile}</h2>
          <button onClick={onClose} style={{background:'none',border:'none',fontSize:20,cursor:'pointer',color:'#94a3b8'}}>✕</button>
        </div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12,marginBottom:6}}>
          <div><label style={S.lbl}>Numero telefonico</label><input style={S.inp} value={phone} onChange={e=>setPhone(e.target.value)} placeholder="Facoltativo"/></div>
          <div><label style={S.lbl}>Stato</label>
            <select style={{...S.inp,cursor:'pointer'}} value={status} onChange={e=>setStatus(e.target.value)}>
              {Object.keys(SERVICE_STATUS_LABEL).map(k=><option key={k} value={k}>{SERVICE_STATUS_LABEL[k]}</option>)}
            </select>
          </div>
          <div><label style={S.lbl}>Data vendita</label><input style={S.inp} type="date" value={saleDate} onChange={e=>setSaleDate(e.target.value)}/></div>
          <div><label style={S.lbl}>Data attivazione</label><input style={S.inp} type="date" value={activationDate} onChange={e=>setActivationDate(e.target.value)}/></div>
          {service.category==='energia'&&service.profile==='Luce'&&<div><label style={S.lbl}>POD</label><input style={S.inp} value={pod} onChange={e=>setPod(e.target.value)}/></div>}
          {service.category==='energia'&&service.profile==='Gas'&&<div><label style={S.lbl}>PDR</label><input style={S.inp} value={pdr} onChange={e=>setPdr(e.target.value)}/></div>}
        </div>
        <ServiceFlags category={service.category} values={flags} onChange={(f,v)=>setFlags(x=>({...x,[f]:v}))}/>
        <div style={{marginTop:12,marginBottom:14}}><label style={S.lbl}>Note</label><textarea style={{...S.inp,height:60,resize:'vertical'}} value={notes} onChange={e=>setNotes(e.target.value)}/></div>
        <div style={{display:'flex',gap:10}}>
          <button onClick={save} style={{...S.btn('lg'),...S.suc,flex:1}}>💾 Salva</button>
          <button onClick={onClose} style={{...S.btn('lg'),...S.gho}}>Annulla</button>
        </div>
      </div>
    </div>
  );
}

/* ── CART MODAL (carrello vendita — genera record di servizio individuali) ── */
function CartModal({onClose,onSaved}){
  const emptyRow=()=>({category:'fissa',profile:'FTTH',quantity:1,phone:'',saleDate:todayStr(),notes:'',voceInternet:false,soloInternet:false,backup:false,casa:false,voceDati:false,soloDati:false,numeroVariabile:false,axpo:false,pod:'',pdr:''});
  const [rows,setRows]=useState([emptyRow()]);
  const [err,setErr]=useState('');
  const [busy,setBusy]=useState(false);

  const profilesFor=(category)=>CATALOG.filter(p=>p.category===category).map(p=>p.profile);

  const updateRow=(i,patch)=>setRows(rs=>rs.map((r,idx)=>idx!==i?r:{...r,...patch}));
  const setCategory=(i,category)=>updateRow(i,{category,profile:profilesFor(category)[0]});
  const setFlag=(i,flag,val)=>updateRow(i,{[flag]:val});
  const addRow=()=>setRows(rs=>[...rs,emptyRow()]);
  const removeRow=(i)=>setRows(rs=>rs.filter((_,idx)=>idx!==i));

  const save=async()=>{
    if(rows.length===0)return setErr('Aggiungi almeno una riga');
    setBusy(true);setErr('');
    try{
      await onSaved(rows);
      onClose();
    }catch(e){setErr('Errore: '+e.message);}
    setBusy(false);
  };

  return(
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.55)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:1000,padding:20}}>
      <div style={{background:'#fff',borderRadius:16,padding:'28px 24px',width:'100%',maxWidth:640,maxHeight:'85vh',overflowY:'auto',boxShadow:'0 20px 60px rgba(0,0,0,.3)'}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:20}}>
          <h2 style={{fontSize:17,fontWeight:800,color:'#0d1b4b'}}>🛒 Carrello vendita</h2>
          <button onClick={onClose} style={{background:'none',border:'none',fontSize:20,cursor:'pointer',color:'#94a3b8'}}>✕</button>
        </div>
        {rows.map((row,i)=>(
          <div key={i} style={{border:'1.5px solid #e2e8f0',borderRadius:10,padding:14,marginBottom:12}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
              <div style={{fontSize:12,fontWeight:700,color:'#94a3b8',textTransform:'uppercase'}}>Riga {i+1}</div>
              {rows.length>1&&<button onClick={()=>removeRow(i)} style={{background:'none',border:'none',color:'#ef4444',cursor:'pointer',fontSize:12,fontWeight:700}}>🗑 Rimuovi</button>}
            </div>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 80px',gap:10,marginBottom:8}}>
              <div><label style={S.lbl}>Categoria</label>
                <select style={{...S.inp,cursor:'pointer'}} value={row.category} onChange={e=>setCategory(i,e.target.value)}>
                  {Object.keys(CATEGORY_LABEL).map(k=><option key={k} value={k}>{CATEGORY_LABEL[k]}</option>)}
                </select>
              </div>
              <div><label style={S.lbl}>Profilo</label>
                <select style={{...S.inp,cursor:'pointer'}} value={row.profile} onChange={e=>updateRow(i,{profile:e.target.value})}>
                  {profilesFor(row.category).map(p=><option key={p} value={p}>{p}</option>)}
                </select>
              </div>
              <div><label style={S.lbl}>Qtà</label><input style={S.inp} type="number" min="1" value={row.quantity} onChange={e=>updateRow(i,{quantity:e.target.value})}/></div>
            </div>
            <ServiceFlags category={row.category} values={row} onChange={(f,v)=>setFlag(i,f,v)}/>
            {row.category==='energia'&&row.profile==='Luce'&&<div style={{marginTop:8}}><label style={S.lbl}>POD</label><input style={S.inp} value={row.pod} onChange={e=>updateRow(i,{pod:e.target.value})}/></div>}
            {row.category==='energia'&&row.profile==='Gas'&&<div style={{marginTop:8}}><label style={S.lbl}>PDR</label><input style={S.inp} value={row.pdr} onChange={e=>updateRow(i,{pdr:e.target.value})}/></div>}
            <div style={{marginTop:8}}><label style={S.lbl}>Note riga</label><input style={S.inp} value={row.notes} onChange={e=>updateRow(i,{notes:e.target.value})}/></div>
          </div>
        ))}
        <button onClick={addRow} style={{...S.btn('sm'),...S.gho,border:'1.5px dashed #cbd5e1',width:'100%',marginBottom:16}}>➕ Aggiungi riga</button>
        {err&&<p style={{color:'#ef4444',fontSize:12,marginBottom:10}}>{err}</p>}
        <div style={{display:'flex',gap:10}}>
          <button onClick={save} disabled={busy} style={{...S.btn('lg'),...S.suc,flex:1,opacity:busy?.7:1}}>{busy?'Salvataggio...':'💾 Salva vendita'}</button>
          <button onClick={onClose} style={{...S.btn('lg'),...S.gho}}>Annulla</button>
        </div>
      </div>
    </div>
  );
}

/* ── CRM APP (master only) ───────────────────── */
function CrmApp({session,onLogout}){
  const [clients,setClients]=useState([]);
  const [clientsLoading,setClientsLoading]=useState(true);
  const [localBackup,setLocalBackup]=useState(null);
  const [view,setView]=useState("dashboard");
  const [selId,setSelId]=useState(null);
  const [editId,setEditId]=useState(null);
  const [form,setForm]=useState(EMPTY);
  const [search,setSearch]=useState("");
  const [F,setF]=useState({attivoDa:"tutti",retiFisse:"tutti",retiMobili:"tutti",trunk:"tutti"});
  const [toast,setToast]=useState(null);
  const [appointments,setAppointments]=useState([]);
  const [apptLoading,setApptLoading]=useState(false);
  const [showApptModal,setShowApptModal]=useState(false);
  const [prospects,setProspects]=useState([]);
  const [prospectsLoading,setProspectsLoading]=useState(false);
  const [prospectModalOpen,setProspectModalOpen]=useState(false);
  const [editProspect,setEditProspect]=useState(null);
  const [prospectSearch,setProspectSearch]=useState('');
  const [prospectStatusFilter,setProspectStatusFilter]=useState('tutti');
  const [services,setServices]=useState([]);
  const [servicesLoading,setServicesLoading]=useState(true);
  const [referenti,setReferenti]=useState([]);
  const [referentiLoading,setReferentiLoading]=useState(true);
  const [showCartModal,setShowCartModal]=useState(false);
  const [showReferenteModal,setShowReferenteModal]=useState(false);
  const [editReferente,setEditReferente]=useState(null);
  const [editService,setEditService]=useState(null);

  const notify=(msg,type="ok")=>{setToast({msg,type});setTimeout(()=>setToast(null),2500)};
  const setFilt=(k,v)=>setF(f=>({...f,[k]:v}));

  const loadClients=useCallback(async()=>{
    setClientsLoading(true);
    try{const r=await fetch('/api/data?type=clients');const d=await r.json();setClients(Array.isArray(d)?d:[]);}catch{setClients([]);}
    setClientsLoading(false);
  },[]);
  useEffect(()=>{loadClients();},[loadClients]);

  useEffect(()=>{
    try{
      if(localStorage.getItem(STORAGE_KEY+'_dismissed'))return;
      const raw=localStorage.getItem(STORAGE_KEY);
      if(raw){const parsed=JSON.parse(raw);if(Array.isArray(parsed)&&parsed.length>0)setLocalBackup(parsed);}
    }catch{}
  },[]);

  const save=async(c)=>{
    setClients(c);
    await fetch('/api/data',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type:'clients',data:c})});
  };
  const importLocalBackup=async()=>{
    await save(localBackup);
    try{localStorage.removeItem(STORAGE_KEY);}catch{}
    setLocalBackup(null);
    notify('Clienti locali importati nel cloud ✓');
  };
  const dismissLocalBackup=()=>{
    try{localStorage.setItem(STORAGE_KEY+'_dismissed','1');}catch{}
    setLocalBackup(null);
  };

  const loadServices=useCallback(async()=>{
    setServicesLoading(true);
    try{const r=await fetch('/api/data?type=services');const d=await r.json();setServices(Array.isArray(d)?d:[]);}catch{setServices([]);}
    setServicesLoading(false);
  },[]);
  useEffect(()=>{loadServices();},[loadServices]);

  const loadReferenti=useCallback(async()=>{
    setReferentiLoading(true);
    try{const r=await fetch('/api/data?type=referenti');const d=await r.json();setReferenti(Array.isArray(d)?d:[]);}catch{setReferenti([]);}
    setReferentiLoading(false);
  },[]);
  useEffect(()=>{loadReferenti();},[loadReferenti]);

  const saveServices=async(list)=>{
    setServices(list);
    await fetch('/api/data',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type:'services',data:list})});
  };
  const saveReferenti=async(list)=>{
    setReferenti(list);
    await fetch('/api/data',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type:'referenti',data:list})});
  };

  const getClientServices=(clientId)=>services.filter(s=>s.clientId===clientId);
  const getClientReferenti=(clientId)=>referenti.filter(r=>r.clientId===clientId);
  const getCounters=(clientId)=>computeServiceCounters(getClientServices(clientId));

  const handleCartSaved=async(rows)=>{
    const newRecords=expandCartToRecords(rows,selId);
    await saveServices([...services,...newRecords]);
    notify(`${newRecords.length} servizi aggiunti ✓`);
  };
  const handleServiceSaved=(updated)=>{
    saveServices(services.map(s=>s.id===updated.id?updated:s));
    setEditService(null);
    notify('Servizio aggiornato ✓');
  };
  const deleteService=(id)=>{
    if(!window.confirm('Eliminare questo servizio?'))return;
    saveServices(services.filter(s=>s.id!==id));
    notify('Servizio eliminato');
  };
  const handleReferenteSaved=(r)=>{
    if(editReferente){
      saveReferenti(referenti.map(x=>x.id===r.id?r:x));
      notify('Referente aggiornato ✓');
    }else{
      saveReferenti([...referenti,{...r,id:uid(),clientId:selId}]);
      notify('Referente aggiunto ✓');
    }
    setShowReferenteModal(false);setEditReferente(null);
  };
  const deleteReferente=(id)=>{
    if(!window.confirm('Eliminare questo referente?'))return;
    saveReferenti(referenti.filter(r=>r.id!==id));
    notify('Referente eliminato');
  };

  const loadAppointments=useCallback(async()=>{
    setApptLoading(true);
    try{const r=await fetch('/api/data?type=appointments');const d=await r.json();setAppointments(Array.isArray(d)?d:[]);}catch{setAppointments([]);}
    setApptLoading(false);
  },[]);

  useEffect(()=>{if(view==="appuntamenti")loadAppointments();},[view,loadAppointments]);

  const loadProspects=useCallback(async()=>{
    setProspectsLoading(true);
    try{const r=await fetch('/api/data?type=contacts');const d=await r.json();setProspects(Array.isArray(d)?d:[]);}catch{setProspects([]);}
    setProspectsLoading(false);
  },[]);

  useEffect(()=>{if(view==="prospect")loadProspects();},[view,loadProspects]);

  const saveProspects=async(list)=>{
    setProspects(list);
    await fetch('/api/data',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type:'contacts',data:list})});
  };
  const deleteProspect=(id)=>{
    if(!window.confirm('Eliminare questo contatto?'))return;
    saveProspects(prospects.filter(p=>p.id!==id));
    notify('Contatto eliminato');
  };
  const handleProspectSaved=(p)=>{
    if(editProspect){
      saveProspects(prospects.map(x=>x.id===p.id?p:x));
      notify('Contatto aggiornato ✓');
    }else{
      if(prospects.some(x=>x.phone===p.phone))return notify('Numero già presente','err');
      saveProspects([...prospects,{...p,id:uid()}]);
      notify('Contatto aggiunto ✓');
    }
    setProspectModalOpen(false);setEditProspect(null);
  };
  const exportProspects=()=>{
    const ws=XLSX.utils.json_to_sheet(prospects.map(p=>({
      Azienda:p.company,Referente:p.contact,Telefono:p.phone,Email:p.email,
      Città:p.city,Provincia:p.province,Settore:p.sector,
      Stato:CC_STATUS_LABEL[p.status]||p.status,Note:p.notes,Ricontatto:p.callbackDate||'',
    })));
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,'Contatti');
    XLSX.writeFile(wb,`contatti_${todayStr()}.xlsx`);
  };
  const filteredProspects=prospects.filter(p=>{
    const ms=!prospectSearch||p.company?.toLowerCase().includes(prospectSearch.toLowerCase())||p.phone?.includes(prospectSearch);
    const mo=prospectStatusFilter==='tutti'||p.status===prospectStatusFilter;
    return ms&&mo;
  });

  const handleSave=()=>{
    if(!form.name.trim())return notify("Inserisci il nome cliente","err");
    if(!form.contractEnd)return notify("Inserisci la scadenza contratto","err");
    if(editId){save(clients.map(c=>c.id===editId?{...form,id:editId}:c));notify("Cliente aggiornato ✓");}
    else{save([...clients,{...form,id:Date.now()}]);notify("Cliente aggiunto ✓");}
    setEditId(null);setForm(EMPTY);setView("clienti");
  };
  const handleDelete=(id)=>{
    save(clients.filter(c=>c.id!==id));
    saveServices(services.filter(s=>s.clientId!==id));
    saveReferenti(referenti.filter(r=>r.clientId!==id));
    setSelId(null);notify("Cliente eliminato");
  };
  const startEdit=(c)=>{setEditId(c.id);setForm({...c});setView("form");};

  const match=(c)=>{
    if(search&&!c.name.toLowerCase().includes(search.toLowerCase())&&!c.contact.toLowerCase().includes(search.toLowerCase()))return false;
    const y=yearsActive(c.contractStart);
    if(F.attivoDa==="lt1"&&!(y!==null&&y<1))return false;
    if(F.attivoDa==="1-2"&&!(y!==null&&y>=1&&y<2))return false;
    if(F.attivoDa==="2-3"&&!(y!==null&&y>=2&&y<3))return false;
    if(F.attivoDa==="gt3"&&!(y!==null&&y>=3))return false;
    const cnt=getCounters(c.id);
    if(F.retiFisse==="0"&&cnt.retiFisseTotale!==0)return false;if(F.retiFisse==="1"&&cnt.retiFisseTotale!==1)return false;
    if(F.retiFisse==="2"&&cnt.retiFisseTotale!==2)return false;if(F.retiFisse==="3+"&&cnt.retiFisseTotale<3)return false;
    if(F.retiMobili==="0"&&cnt.mobiliTotale!==0)return false;if(F.retiMobili==="1-3"&&!(cnt.mobiliTotale>=1&&cnt.mobiliTotale<=3))return false;
    if(F.retiMobili==="4-9"&&!(cnt.mobiliTotale>=4&&cnt.mobiliTotale<=9))return false;if(F.retiMobili==="10+"&&cnt.mobiliTotale<10)return false;
    if(F.trunk==="si"&&cnt.trunk===0)return false;if(F.trunk==="no"&&cnt.trunk>0)return false;
    return true;
  };

  const filtered=clients.filter(match);
  const expiring=clients.filter(c=>daysUntil(c.contractEnd)<=60&&daysUntil(c.contractEnd)>=0);
  const expired=clients.filter(c=>daysUntil(c.contractEnd)<0);
  const highRisk=clients.filter(c=>c.churnRisk==="alto");
  const sel=clients.find(c=>c.id===selId);
  const todayAppts=appointments.filter(a=>a.date===todayStr());
  const upcomingAppts=appointments.filter(a=>a.date>=todayStr()).sort((a,b)=>a.date.localeCompare(b.date));
  const pastAppts=appointments.filter(a=>a.date<todayStr()).sort((a,b)=>b.date.localeCompare(a.date));

  const TABS=[{k:"dashboard",l:"📊 Dashboard"},{k:"clienti",l:"👥 Clienti"},{k:"prospect",l:"📇 Anagrafica Call Center"},{k:"scadenze",l:"📅 Scadenze"},{k:"appuntamenti",l:"🗓 Appuntamenti"}];

  const FSel=({label,fkey,opts})=>(
    <div>
      <div style={{fontSize:10,fontWeight:700,color:"#94a3b8",textTransform:"uppercase",letterSpacing:".05em",marginBottom:3}}>{label}</div>
      <select style={S.sel} value={F[fkey]} onChange={e=>setFilt(fkey,e.target.value)}>
        {opts.map(([v,l])=><option key={v} value={v}>{l}</option>)}
      </select>
    </div>
  );

  return(
    <div style={S.app}>
      {toast&&<div style={S.toast(toast.type)}>{toast.msg}</div>}
      {showApptModal&&<AppointmentModal onClose={()=>setShowApptModal(false)} onSaved={()=>{loadAppointments();notify('Appuntamento salvato ✓');}}/>}
      {prospectModalOpen&&<ProspectModal initial={editProspect} onClose={()=>{setProspectModalOpen(false);setEditProspect(null);}} onSaved={handleProspectSaved}/>}
      <header style={S.hdr}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <div style={{width:32,height:32,background:"#3b82f6",borderRadius:8,display:"flex",alignItems:"center",justifyContent:"center",fontSize:16}}>📱</div>
          <div>
            <div style={{fontSize:15,fontWeight:700}}>TIM Business CRM</div>
            <div style={{fontSize:10,color:"#94a3b8"}}>👑 {session.name} · Master</div>
          </div>
        </div>
        <nav style={{display:"flex",gap:6,flexWrap:"wrap",alignItems:"center"}}>
          {TABS.map(t=>(
            <button key={t.k} style={S.nb(view===t.k)} onClick={()=>{setView(t.k);setSelId(null);}}>
              {t.l}
              {t.k==="appuntamenti"&&todayAppts.length>0&&<span style={{marginLeft:5,background:"#ef4444",borderRadius:10,padding:"1px 6px",fontSize:10}}>{todayAppts.length}</span>}
            </button>
          ))}
          <button style={S.nb(view==="form"&&!editId)} onClick={()=>{setEditId(null);setForm(EMPTY);setView("form");}}>+ Aggiungi</button>
          <a href="/callcenter.html" style={{padding:"7px 12px",borderRadius:8,fontSize:12,fontWeight:700,background:"#22c55e",color:"#fff",textDecoration:"none"}}>📞 Call Center</a>
          <button onClick={()=>{clearSession();onLogout();}} style={{...S.nb(false),background:"rgba(239,68,68,.3)"}}>Esci</button>
        </nav>
      </header>

      <div style={S.wrap}>
        {localBackup&&(
          <div style={{...S.card,background:"#fffbeb",borderLeft:"4px solid #f59e0b",display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:10}}>
            <div style={{fontSize:13,color:"#475569"}}>
              📦 Abbiamo trovato <strong>{localBackup.length}</strong> client{localBackup.length===1?"e":"i"} salvat{localBackup.length===1?"o":"i"} solo su questo browser. Vuoi importarli nel cloud (visibili da qualsiasi dispositivo)?
            </div>
            <div style={{display:"flex",gap:8}}>
              <button onClick={importLocalBackup} style={{...S.btn("sm"),...S.suc}}>☁️ Importa nel cloud</button>
              <button onClick={dismissLocalBackup} style={{...S.btn("sm"),...S.gho}}>Ignora</button>
            </div>
          </div>
        )}

        {view==="dashboard"&&(
          <>
            <div style={{marginBottom:16}}>
              <h2 style={{fontSize:18,fontWeight:800,color:"#0d1b4b"}}>Benvenuto, {session.name} 👋</h2>
              <p style={{fontSize:12,color:"#64748b",marginTop:3}}>Riepilogo del tuo portafoglio</p>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:12,marginBottom:14}}>
              <div style={{...S.card,marginBottom:0,textAlign:"center"}}><div style={{fontSize:26,fontWeight:800,color:"#0d1b4b"}}>{clients.length}</div><div style={{fontSize:11,color:"#64748b",marginTop:2,fontWeight:500}}>Clienti totali</div></div>
              <div style={{...S.card,marginBottom:0,textAlign:"center",borderLeft:"3px solid #f59e0b"}}><div style={{fontSize:26,fontWeight:800,color:"#f59e0b"}}>{expiring.length}</div><div style={{fontSize:11,color:"#64748b",marginTop:2,fontWeight:500}}>Scadenze entro 60gg</div></div>
              <div style={{...S.card,marginBottom:0,textAlign:"center",borderLeft:"3px solid #ef4444"}}><div style={{fontSize:26,fontWeight:800,color:"#ef4444"}}>{highRisk.length}</div><div style={{fontSize:11,color:"#64748b",marginTop:2,fontWeight:500}}>Rischio alto</div></div>
            </div>

                <div><label style={S.lbl}>Referente</label><input style={S.inp} value={form.contact} onChange={e=>setForm(f=>({...f,contact:e.target.value}))} placeholder="Nome cognome"/></div>
                <div><label style={S.lbl}>Telefono</label><input style={S.inp} value={form.phone} onChange={e=>setForm(f=>({...f,phone:e.target.value}))} placeholder="333 1234567"/></div>
                <div><label style={S.lbl}>Rischio churn</label><select style={{...S.inp,cursor:"pointer"}} value={form.churnRisk} onChange={e=>setForm(f=>({...f,churnRisk:e.target.value}))}><option value="basso">🟢 Basso</option><option value="medio">🟡 Medio</option><option value="alto">🔴 Alto</option></select></div>
              </div>
              <div style={{fontSize:11,fontWeight:700,color:"#94a3b8",textTransform:"uppercase",letterSpacing:".05em",marginBottom:10}}>Contratto</div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:16}}>
                <div><label style={S.lbl}>Data stipula</label><input style={S.inp} type="date" value={form.contractStart} onChange={e=>setForm(f=>({...f,contractStart:e.target.value}))}/></div>
                <div><label style={S.lbl}>Scadenza *</label><input style={S.inp} type="date" value={form.contractEnd} onChange={e=>setForm(f=>({...f,contractEnd:e.target.value}))}/></div>
              </div>
              <div style={{marginBottom:16}}><label style={S.lbl}>Note</label><textarea style={{...S.inp,height:70,resize:"vertical"}} value={form.notes} onChange={e=>setForm(f=>({...f,notes:e.target.value}))} placeholder="Note sul cliente..."/></div>
              <div style={{display:"flex",gap:10}}>
                <button style={{...S.btn("lg"),...S.pri}} onClick={handleSave}>💾 Salva</button>
                <button style={{...S.btn("lg"),...S.gho}} onClick={()=>{setEditId(null);setForm(EMPTY);setView("clienti");}}>Annulla</button>
              </div>
            </div>
          </>
        )}
      </div>
    </div>
  );
}

/* ── ROOT ─────────────────────────────────────── */
function App(){
  const [session,setSession_]=useState(getSession);

  // If agent lands on CRM page, redirect once via effect (not during render)
  useEffect(()=>{
    if(session&&session.role==='agent'){
      window.location.href='/callcenter.html';
    }
  },[]);

  const handleLogin=(role,name)=>{
    const s={role,name};
    setSession(s);
    setSession_(s);
    if(role==='agent'){
      window.location.href='/callcenter.html';
    }
  };

  const handleLogout=()=>{clearSession();setSession_(null);};

  if(!session) return <LoginScreen onLogin={handleLogin}/>;
  if(session.role==='master') return <CrmApp session={session} onLogout={handleLogout}/>;

  // Agent - show loading while useEffect redirect fires
  return(
    <div style={{minHeight:'100vh',background:'#0d1b4b',display:'flex',alignItems:'center',justifyContent:'center'}}>
      <div style={{color:'#fff',fontSize:14}}>Apertura Call Center...</div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));}</script>
